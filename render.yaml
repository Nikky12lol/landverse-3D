services:
  - type: web
    name: landverse-3d-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: landverse-db
          property: connectionString
      - key: UPLOAD_DIRECTORY
        value: /app/uploads
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: landverse-db
    plan: free
