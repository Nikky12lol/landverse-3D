upstream api {
    server api:8000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Backend API + uploads + docs through the same origin, so a single
    # public URL serves the whole app (UI calls /parcels, /health, ...).
    location ~ ^/(health|seed|docs|openapi.json|parcels|buildings|units|ulpin|analysis|validation|infrastructure|stats|uploads)(/|$) {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # React Router fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
    }
}
